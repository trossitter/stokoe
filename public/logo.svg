<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="logo-title">
  <title id="logo-title">Stokoe</title>
  <defs>
    <radialGradient id="amb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f7eec1" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#f7eec1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fill" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0df9a"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="#141623"/>

  <!-- ambient glow -->
  <circle cx="256" cy="256" r="172" fill="url(#amb)"/>

  <!-- 4-point star -->
  <path
    d="M256 80 L273 239 L432 256 L273 273 L256 432 L239 273 L80 256 L239 239 Z"
    fill="url(#fill)"
    filter="url(#glow)"
  />

  <!-- bright centre -->
  <circle cx="256" cy="256" r="14" fill="white" filter="url(#glow)"/>
</svg>
