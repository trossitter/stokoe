<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="logo-title" viewBox="0 0 512 512">
  <title id="logo-title">Stokoe light mark</title>
  <defs>
    <radialGradient id="light" cx="50%" cy="31%" r="48%">
      <stop offset="0%" stop-color="#fff7c9"/>
      <stop offset="38%" stop-color="#f0df9a" stop-opacity="0.9"/>
      <stop offset="76%" stop-color="#f0df9a" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#f0df9a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="139" x2="371" y1="390" y2="119" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f7eec1"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="soft-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" result="blur" stdDeviation="10"/>
      <feColorMatrix in="blur" result="warm" type="matrix" values="1 0 0 0 0.96  0 1 0 0 0.82  0 0 1 0 0.38  0 0 0 0.55 0"/>
      <feMerge>
        <feMergeNode in="warm"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="#141623"/>
  <rect x="26" y="26" width="460" height="460" rx="92" fill="none" stroke="#f0df9a" stroke-opacity="0.16" stroke-width="2"/>
  <circle cx="256" cy="158" r="178" fill="url(#light)"/>
  <circle cx="256" cy="147" r="31" fill="#fff3b0" filter="url(#soft-glow)"/>

  <g stroke="#f8edbc" stroke-linecap="round" stroke-width="12" opacity="0.42">
    <path d="M256 69v42"/>
    <path d="M187 91l24 35"/>
    <path d="M325 91l-24 35"/>
    <path d="M143 151h47"/>
    <path d="M322 151h47"/>
  </g>

  <g fill="none" stroke="url(#line)" stroke-linecap="round" stroke-linejoin="round" filter="url(#soft-glow)">
    <path d="M133 323c39 36 81 54 127 54 45 0 84-18 119-54" stroke-width="19"/>
    <path d="M178 306c24-26 51-39 80-39 30 0 58 13 84 39" stroke-width="15" opacity="0.88"/>
    <path d="M191 307l-34-52" stroke-width="15"/>
    <path d="M228 282l-10-74" stroke-width="15"/>
    <path d="M268 277l13-78" stroke-width="15"/>
    <path d="M307 288l34-65" stroke-width="15"/>
  </g>

  <path d="M158 409c35 19 68 28 99 28 32 0 65-9 99-28" fill="none" stroke="#f0df9a" stroke-linecap="round" stroke-width="8" opacity="0.35"/>
</svg>
